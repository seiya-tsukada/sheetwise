services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      # ホストの localhost（127.0.0.1）からのみ接続を受け付ける
      - "127.0.0.1:5173:5173"
    volumes:
      # ホストのソースをマウントし、編集を即時反映する
      - .:/app
      # node_modules はコンテナ（Linux）専用。ホスト（macOS等）のネイティブバイナリと混ざらないよう分離する
      - node_modules:/app/node_modules
    environment:
      # マウント越しでもファイル変更を検知できるようポーリングで監視する
      - CHOKIDAR_USEPOLLING=true

volumes:
  node_modules:
